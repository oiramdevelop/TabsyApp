<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabsy — Mi perfil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#0f2240; --blue:#1a3a6b; --steel:#4a6fa5; --sand:#c9a96e; --cream:#f5f0e8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--cream); min-height: 100vh; }
    h1,h2 { font-family: 'Playfair Display', serif; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fadeUp 0.5s ease both; }

    .page-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 110px 20px 60px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 8px 40px rgba(15,34,64,0.08);
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 32px;
      cursor: pointer;
    }
    .avatar-img, .avatar-initial {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
    }
    .avatar-initial {
      background: linear-gradient(135deg, #c9a96e, #b8924a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 800;
      color: white;
    }
    .avatar-overlay {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(15,34,64,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s;
      color: white;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .avatar-wrap:hover .avatar-overlay { opacity: 1; }
    .avatar-uploading .avatar-overlay { opacity: 1; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--navy);
      opacity: 0.55;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .form-input {
      width: 100%;
      background: white;
      border: 1.5px solid rgba(15,34,64,0.12);
      border-radius: 12px;
      padding: 13px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--navy);
      transition: all 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--steel);
      box-shadow: 0 0 0 3px rgba(74,111,165,0.1);
    }
    .form-input:disabled {
      background: rgba(15,34,64,0.03);
      color: rgba(15,34,64,0.35);
      cursor: not-allowed;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--navy), var(--blue));
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(15,34,64,0.3); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .field-group { margin-bottom: 20px; }

    .note {
      font-size: 0.78rem;
      color: rgba(15,34,64,0.38);
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div id="navbar"></div>

<div class="page-wrap">
  <div class="card fade-up">

    <h2 style="font-size:1.6rem;font-weight:800;color:var(--navy);margin-bottom:6px;">Mi perfil</h2>
    <p style="font-size:0.88rem;color:rgba(15,34,64,0.45);margin-bottom:36px;">Actualiza tu nombre y foto de perfil</p>

    <!-- Avatar -->
    <div class="avatar-wrap" id="avatar-wrap" title="Cambiar foto">
      <img id="avatar-img" class="avatar-img" src="" alt="" style="display:none;" />
      <div id="avatar-initial" class="avatar-initial"></div>
      <div class="avatar-overlay" id="avatar-overlay">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span id="overlay-label">Cambiar foto</span>
      </div>
      <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/webp" style="display:none;" />
    </div>

    <!-- Formulario -->
    <form id="form-perfil">
      <div class="field-group">
        <label for="inp-name">Nombre completo</label>
        <input id="inp-name" type="text" class="form-input" placeholder="Tu nombre" required />
      </div>

      <div class="field-group">
        <label for="inp-email">Correo electrónico</label>
        <input id="inp-email" type="email" class="form-input" disabled />
        <p class="note">El correo no se puede cambiar</p>
      </div>

      <button type="submit" class="btn-primary" id="btn-guardar">Guardar cambios</button>
    </form>

  </div>
</div>

<div id="tabsy-loader"></div>

<script type="module" src="/assets/js/pages/perfil.js"></script>
</body>
</html>
