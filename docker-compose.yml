services:

  # ── Frontend estático con Nginx ──────────────────────────────
  frontend:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: tabsy_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html
    ports:
      - "80:80"
    depends_on:
      - app

  # ── Microservicio Python (estadísticas) ──────────────────────
  stats:
    build:
      context: ./stats
      dockerfile: Dockerfile
    container_name: tabsy_stats
    restart: unless-stopped
    volumes:
      - ./stats:/app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: tabsy_db
      DB_USERNAME: root
      DB_PASSWORD: toor
    depends_on:
      mysql:
        condition: service_healthy

  # ── Tailwind CSS watcher ─────────────────────────────────────
  tailwind:
    image: node:20
    container_name: tabsy_tailwind
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - tailwind_node_modules:/app/node_modules
    command: sh -c "npm install && npx tailwindcss -i ./assets/css/input.css -o ./assets/css/output.css --watch --poll"

  # ── Backend Laravel ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tabsy_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - vendor_cache:/var/www/vendor
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: tabsy_db
      DB_USERNAME: root
      DB_PASSWORD: toor
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "composer install --no-interaction --no-dev --optimize-autoloader && php artisan migrate --force && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=8000"

  # ── Base de datos MySQL ──────────────────────────────────────
  mysql:
    image: mysql:8
    container_name: tabsy_db
    restart: always
    environment:
      MYSQL_DATABASE: tabsy_db
      MYSQL_ROOT_PASSWORD: toor
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptoor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tailwind_node_modules:
  vendor_cache:
  mysql_data:
